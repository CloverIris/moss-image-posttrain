# Native JAX LoRA SFT; cache may mix text-only and image+text examples.
model: {attention_backend: cudnn, dit_autotune_level: 4, activation_storage: gpu, checkpoint_interval: 1}
data: {cache: cache/sft, context_length: 4096}
lora: {rank: 4, alpha: 4.0, preset: attn-mlp}
optimizer: {learning_rate: 0.00001}
sft:
  sigma_distribution: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  sigma_shift: 1.0
  conditioning_dropout: 0.1
training: {max_updates: 1000, batch_size: 4, checkpoint_every: 100, seed: 42}
runtime: {devices: [0, 1, 2, 3], output_dir: outputs/sft}
