# 5070Ti_REMOTE PCIe switch pairs: [0,3] (08/1d), [1,2] (10/14).
# Two tensor-parallel pairs; global batch 2 = one sample per pair.
model: {attention_backend: cudnn, dit_autotune_level: 4, activation_storage: gpu, checkpoint_interval: 1}
data: {cache: cache/sft_1024_smoke, context_length: 4096}
lora: {rank: 4, alpha: 4.0, preset: attn-mlp}
sft: {conditioning_dropout: 0.0}
training: {max_updates: 3, batch_size: 2, checkpoint_every: 3, seed: 42}
runtime: {devices: [0, 3, 1, 2], tensor_parallel_size: 2, output_dir: outputs/sft_1024_tp2}
