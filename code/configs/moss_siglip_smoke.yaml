# Real native-JAX 5B MOSS + native VAE + detached SigLIP2 CPU reward.
# Short run validates mechanics; three-step images are not a quality benchmark.
name: moss-5b-art-siglip-smoke
lora: {rank: 2, alpha: 2.0, preset: attn}
sampling:
  sampler: euler
  scheduler: moss
  height: 256
  width: 256
  steps: 3
  prompts_per_rollout: 1
  group_size: 2
  train_timesteps: [0]
training: {max_updates: 2, checkpoint_every: 2, evaluate_every: 2}
reward: {kind: siglip, decode: true}
runtime: {devices: [1], output_dir: outputs/moss_siglip_smoke}
