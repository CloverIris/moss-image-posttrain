model: {attention_backend: cudnn, dit_autotune_level: 4}
# Validated multi-GPU configuration on free physical GB203(SM120) devices.
# Six images/rollout, full prompt groups, two global ART windows.
name: moss-5b-art-siglip-three-gpu-validation
lora: {rank: 2, alpha: 2.0, preset: attn}
sampling:
  sampler: euler
  scheduler: moss
  height: 256
  width: 256
  steps: 3
  prompts_per_rollout: 3
  group_size: 2
  train_timesteps: [0]
training: {max_updates: 2, checkpoint_every: 2, evaluate_every: 2}
reward: {kind: siglip, decode: true}
runtime: {devices: [1, 2, 3], output_dir: outputs/moss_siglip_3gpu}
