# Opt-in larger microbatch: higher memory, modest measured throughput gain.
# Two same-switch TP2 pairs, three concurrent examples per pair.
model:
  attention_backend: cudnn
  dit_autotune_level: 4
  activation_storage: gpu
  checkpoint_interval: 1
data:
  cache: cache/sft
  context_length: 4096
lora:
  rank: 4
  alpha: 4.0
  preset: attn-mlp
optimizer:
  learning_rate: 1.0e-05
sft:
  sigma_distribution: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  sigma_shift: 1.0
  conditioning_dropout: 0.1
training:
  max_updates: 1000
  batch_size: 6
  checkpoint_every: 100
  seed: 42
  microbatch_size: 3
runtime:
  devices:
  - 0
  - 3
  - 1
  - 2
  tensor_parallel_size: 2
  output_dir: outputs/sft_tp2_mb3
